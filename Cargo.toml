[workspace]
resolver = "2"
members = [
    "crates/cbdesk-proto",
    "crates/cbdesk-crypto",
    "crates/cbdesk-discovery",
    "crates/cbdesk-net",
    "crates/cbdesk-session",
    "crates/cbdesk-testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["CBDesk contributors"]
repository = "https://github.com/cumabozkurt/cbdesk"
rust-version = "1.83"
publish = false

# Exact versions: the MSRV-aware resolver is newer than Rust 1.83, and current
# crates.io releases often need Rust 1.85. Do not loosen these to a range.
[workspace.dependencies]
thiserror = "=1.0.69"
blake3 = { version = "=1.5.5", default-features = false, features = ["pure", "std"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast", "zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "=0.12.4"
sha2 = "=0.10.8"
argon2 = "=0.5.3"
zeroize = { version = "=1.8.1", features = ["derive"] }
zeroize_derive = "=1.4.3"
getrandom = "=0.2.15"
# 1.53.3 is the newest tokio that still builds on Rust 1.83 and includes the
# broadcast-channel soundness fix (RUSTSEC-2025-0023). 1.54 needs Rust 1.85.
tokio = { version = "=1.53.3", features = ["rt", "sync", "macros", "time"] }
async-trait = "=0.1.83"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
toml = "=0.8.23"
toml_edit = "=0.22.27"
proptest = "=1.5.0"
tempfile = "=3.15.0"
tracing = "=0.1.40"
# Direct pins for transitive crates whose caret ranges now include Rust 1.85 releases.
base64ct = { version = "=1.7.3", default-features = false }
hashbrown = { version = "=0.16.1", default-features = false }
indexmap = { version = "=2.13.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
