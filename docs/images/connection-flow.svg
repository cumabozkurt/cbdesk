<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img">
  <title>CBDesk connection flow</title>
  <desc>Diagram of a consented CBDesk session. The ticket only locates a computer. The person at the host approves within 30 seconds or the connection closes. The session indicator stays visible.</desc>
  <rect width="920" height="560" fill="#f7f4ef"/>
  <text x="32" y="40" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">Connection flow</text>
  <text x="32" y="64" fill="#5c5346" font-family="Segoe UI, system-ui, sans-serif" font-size="14">What the code does. A live symmetric NAT was not measured.</text>

  <rect x="32" y="88" width="856" height="64" rx="10" fill="#fff" stroke="#1c1915" stroke-width="2"/>
  <text x="48" y="116" fill="#6b3f12" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="72" y="116" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Host prints an invite ticket</text>
  <text x="72" y="136" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">The ticket is a locator. It does not authorize viewing or control.</text>

  <rect x="32" y="168" width="856" height="64" rx="10" fill="#fff" stroke="#1c1915" stroke-width="2"/>
  <text x="48" y="196" fill="#6b3f12" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="72" y="196" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Viewer dials that ticket, or browses the LAN</text>
  <text x="72" y="216" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">--browse uses mDNS. A ticket cannot add a relay. --relay is the operator's choice.</text>

  <rect x="32" y="248" width="856" height="80" rx="10" fill="#fff8ee" stroke="#6b3f12" stroke-width="2"/>
  <text x="48" y="276" fill="#6b3f12" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="72" y="276" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Person at the host approves</text>
  <text x="72" y="296" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">No answer within 30 seconds closes the connection. The desk host can confirm pairing</text>
  <text x="72" y="314" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">with two short-code words. Those words are not written into the ticket.</text>

  <rect x="32" y="344" width="856" height="64" rx="10" fill="#fff" stroke="#1c1915" stroke-width="2"/>
  <text x="48" y="372" fill="#6b3f12" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">4</text>
  <text x="72" y="372" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">The grant names what is allowed</text>
  <text x="72" y="392" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">View, input, clipboard, audio, and files are separate. A side stream before the grant is refused.</text>

  <rect x="32" y="424" width="856" height="64" rx="10" fill="#fff" stroke="#1c1915" stroke-width="2"/>
  <text x="48" y="452" fill="#6b3f12" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">5</text>
  <text x="72" y="452" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Session indicator stays visible</text>
  <text x="72" y="472" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">It cannot be switched off. Quick Support cannot turn on unattended access.</text>

  <rect x="32" y="504" width="856" height="40" rx="8" fill="#3a2a12"/>
  <text x="48" y="529" fill="#fff8ee" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Direct loopback and same-machine LAN tests exist. A live symmetric NAT is unmeasured. This is not 30 frames per second.</text>
</svg>
