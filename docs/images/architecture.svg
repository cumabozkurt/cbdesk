<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img">
  <title>CBDesk architecture diagram</title>
  <desc>Diagram of the CBDesk process, not a screenshot. The person at the host approves. A Flutter shell or the CLI talks to the Rust core. The core uses QUIC. An optional operator relay forwards packets and does not receive the session keys. There is no CBDesk account server.</desc>
  <rect width="920" height="520" fill="#f7f4ef"/>
  <text x="32" y="40" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">Architecture</text>
  <text x="32" y="64" fill="#5c5346" font-family="Segoe UI, system-ui, sans-serif" font-size="14">A diagram of this tree. Not a picture of the window.</text>

  <rect x="32" y="88" width="856" height="64" rx="10" fill="#fff" stroke="#1c1915" stroke-width="2"/>
  <text x="48" y="116" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Person at the host</text>
  <text x="48" y="136" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Sees the approval and the session indicator. The indicator has no off switch.</text>

  <rect x="32" y="176" width="410" height="88" rx="10" fill="#fff" stroke="#6b3f12" stroke-width="2"/>
  <text x="48" y="206" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Flutter shell</text>
  <text x="48" y="228" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">app/desktop. Turkish and English.</text>
  <text x="48" y="248" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Home, connect, consent, view, files, address book, settings.</text>

  <rect x="478" y="176" width="410" height="88" rx="10" fill="#fff" stroke="#6b3f12" stroke-width="2"/>
  <text x="494" y="206" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">cbdesk CLI</text>
  <text x="494" y="228" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">host, view, net-check, doctor.</text>
  <text x="494" y="248" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">The CLI host does not run the short-code exchange.</text>

  <rect x="32" y="288" width="856" height="112" rx="10" fill="#fff8ee" stroke="#1c1915" stroke-width="2"/>
  <text x="48" y="318" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Rust core</text>
  <text x="48" y="342" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Consent and grants. Ticket is a locator, not permission. QUIC (iroh), n0 relays left off.</text>
  <text x="48" y="362" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Picture: color YUV, software VP8. AV1 is a still-picture fallback. VP9 is absent.</text>
  <text x="48" y="382" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Hardware encoders are not linked. Opening one fails closed.</text>

  <rect x="32" y="424" width="410" height="72" rx="10" fill="#fff" stroke="#1c1915" stroke-width="2"/>
  <text x="48" y="452" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Display capture</text>
  <text x="48" y="474" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Only after --screen or the desktop host. --synthetic never touches it.</text>

  <rect x="478" y="424" width="410" height="72" rx="10" fill="#fff" stroke="#1c1915" stroke-width="2"/>
  <text x="494" y="452" fill="#1c1915" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Optional operator relay</text>
  <text x="494" y="474" fill="#3a342c" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Named with --relay. This repo runs no public relay. No CBDesk account.</text>
</svg>
