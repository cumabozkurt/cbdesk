# Flatpak manifest template. It has not been submitted to Flathub.
app-id: com.cbdesk.CBDesk
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cbdesk
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: cbdesk
    buildsystem: simple
    build-commands:
      - cargo build --locked --release -p cbdesk-cli --bin cbdesk
      - install -D target/release/cbdesk /app/bin/cbdesk
    sources:
      - type: dir
        path: ../..
