[package]
name = "cbdesk-codec"
description = "Software VP8 inter frames and AV1 stills for a color picture."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Each flag lets `open_hardware` look for that platform's VP8 ffmpeg encoder.
# The flags are off in ordinary CI. Turning one on does not invent a device.
hw-vaapi = []
hw-mediafoundation = []
hw-videotoolbox = []
hw-mediacodec = []

[dependencies]
cbdesk-capture = { path = "../cbdesk-capture" }
oxideav-vp8.workspace = true
wide.workspace = true
rav1e.workspace = true
rav1d-safe.workspace = true
thiserror.workspace = true

[lints]
workspace = true
