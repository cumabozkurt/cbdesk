[package]
name = "cbdesk-hostops"
description = "Consent-gated operating-system effects for a host session."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cbdesk-session = { path = "../cbdesk-session" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "alloc", "fs", "pty"] }

[dev-dependencies]
cbdesk-capture = { path = "../cbdesk-capture" }
cbdesk-proto = { path = "../cbdesk-proto" }

[lints]
workspace = true
